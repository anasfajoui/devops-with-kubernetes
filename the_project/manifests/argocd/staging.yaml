apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/anasfajoui/devops-with-kubernetes.git
    targetRevision: main
    path: the_project/manifests/overlays/staging
    kustomize:
      images:
        - PROJECT/IMAGE=europe-west1-docker.pkg.dev/dwk-gke-510521/dwk-repository/the-project:main-fd9d77960a88d74982db6636014828d6c3395ec5
        - TODO/IMAGE=europe-west1-docker.pkg.dev/dwk-gke-510521/dwk-repository/todo-backend:main-fd9d77960a88d74982db6636014828d6c3395ec5
        - BROADCASTER/IMAGE=europe-west1-docker.pkg.dev/dwk-gke-510521/dwk-repository/broadcaster:main-fd9d77960a88d74982db6636014828d6c3395ec5
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
