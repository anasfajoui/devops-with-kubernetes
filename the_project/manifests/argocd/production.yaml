apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/anasfajoui/devops-with-kubernetes.git
    targetRevision: 5ce33301dad15df59a794506dbe7c34cb6bfebe8
    path: the_project/manifests/overlays/production
    kustomize:
      images:
        - PROJECT/IMAGE=europe-west1-docker.pkg.dev/dwk-gke-510521/dwk-repository/the-project:production-98871319056813391f885575e56bf416099ea91a
        - TODO/IMAGE=europe-west1-docker.pkg.dev/dwk-gke-510521/dwk-repository/todo-backend:production-98871319056813391f885575e56bf416099ea91a
        - BROADCASTER/IMAGE=europe-west1-docker.pkg.dev/dwk-gke-510521/dwk-repository/broadcaster:production-98871319056813391f885575e56bf416099ea91a
      patches:
        - patch: |-
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: todo-backup-config
            data:
              GCS_BUCKET: dwk-gke-510521-todo-backups
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
