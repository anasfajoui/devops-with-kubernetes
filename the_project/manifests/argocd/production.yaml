apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/anasfajoui/devops-with-kubernetes.git
    targetRevision: refs/tags/4.9
    path: the_project/manifests/overlays/production
    kustomize:
      images:
        - PROJECT/IMAGE=europe-west1-docker.pkg.dev/dwk-gke-510521/dwk-repository/the-project:4.9-dce34a8fb0e11c4ebf64d430248e2f75587e44f4
        - TODO/IMAGE=europe-west1-docker.pkg.dev/dwk-gke-510521/dwk-repository/todo-backend:4.9-dce34a8fb0e11c4ebf64d430248e2f75587e44f4
        - BROADCASTER/IMAGE=europe-west1-docker.pkg.dev/dwk-gke-510521/dwk-repository/broadcaster:4.9-dce34a8fb0e11c4ebf64d430248e2f75587e44f4
      patches:
        - patch: |-
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: todo-backup-config
            data:
              GCS_BUCKET: dwk-gke-510521-todo-backups
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
