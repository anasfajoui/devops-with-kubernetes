apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging
resources:
  - ../../base

patches:
  - target:
      kind: ConfigMap
      name: todo-backend-config|broadcaster-config
    patch: |-
      - op: replace
        path: /data/NATS_SUBJECT
        value: todos.staging.events
  - target:
      kind: ConfigMap
      name: broadcaster-config
    patch: |-
      - op: add
        path: /data/BROADCASTER_MODE
        value: log
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: broadcaster-dep
        namespace: project
      spec:
        template:
          spec:
            containers:
              - name: broadcaster
                env:
                  - name: DISCORD_WEBHOOK_URL
                    $patch: delete
