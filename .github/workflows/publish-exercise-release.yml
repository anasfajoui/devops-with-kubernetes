name: Publish exercise release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish exercise release
    runs-on: ubuntu-latest

    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v6

      - name: Create releases for completed exercises
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          subject="$(git log -1 --format='%s' "$COMMIT_SHA")"

          if [[ ! "$subject" =~ ^([0-9]+\.[0-9]+):[[:space:]]+done$ ]]; then
            echo "Commit '$subject' does not complete an exercise; skipping."
            exit 0
          fi

          exercise="${BASH_REMATCH[1]}"

          if gh release view "$exercise" >/dev/null 2>&1; then
            echo "Release $exercise already exists; skipping."
            exit 0
          fi

          exercise_title="$(awk -v prefix="- [$exercise. " '
            index($0, prefix) == 1 {
              title = substr($0, length(prefix) + 1)
              sub(/\]\(.*/, "", title)
              print title
              exit
            }
          ' README.md)"

          if [[ -z "$exercise_title" ]]; then
            echo "No title found for exercise $exercise in README.md." >&2
            exit 1
          fi

          gh release create "$exercise" \
            --target "$COMMIT_SHA" \
            --title "$exercise" \
            --notes "$exercise_title"
