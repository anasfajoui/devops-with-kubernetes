name: Delete branch environment

on:
  delete:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-application
  cancel-in-progress: false
  queue: max

env:
  GKE_CLUSTER: dwk-cluster
  GKE_LOCATION: europe-west1-b

jobs:
  delete-environment:
    name: Delete branch namespace
    if: >-
      github.event.ref_type == 'branch' &&
      github.event.ref != 'project' &&
      github.event.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: GKE_PROJECT
    env:
      PROJECT_ID: ${{ secrets.GKE_PROJECT }}
      NAMESPACE: ${{ github.event.ref }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate branch namespace
        run: |
          case "$NAMESPACE" in
            default|kube-*)
              echo "Refusing to delete protected namespace: $NAMESPACE"
              exit 1
              ;;
          esac

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          project_id: ${{ env.PROJECT_ID }}
          location: ${{ env.GKE_LOCATION }}

      - name: Delete namespace
        run: kubectl delete namespace "$NAMESPACE" --ignore-not-found=true --timeout=30m
