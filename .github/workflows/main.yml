name: Release application

on:
  push:
  workflow_dispatch:
    inputs:
      todo_commit:
        description: Todo source commit to build (leave empty to deploy configuration only)
        type: string
        required: false
      todo_environment:
        description: Destination for the Todo source build
        type: choice
        options:
          - staging
          - production
        default: staging

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-application
  cancel-in-progress: false
  queue: max

env:
  GKE_CLUSTER: dwk-cluster
  GKE_LOCATION: europe-west1-b
  GKE_CLUSTER_VERSION: "1.36"
  REGISTRY: europe-west1-docker.pkg.dev
  REPOSITORY: dwk-repository
  SOPS_VERSION: "3.13.3"
  ARGO_CD_VERSION: "v3.6.2"
  ARGO_ROLLOUTS_VERSION: "v1.10.1"
  PROJECT_IMAGE: the-project
  TODO_BACKEND_IMAGE: todo-backend
  BROADCASTER_IMAGE: broadcaster
  LOG_OUTPUT_WRITER_IMAGE: log-output-writer
  LOG_OUTPUT_READER_IMAGE: log-output-reader
  PING_PONG_IMAGE: ping-pong

jobs:
  ensure-cluster:
    name: Ensure GKE cluster is ready
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: GKE_PROJECT
    env:
      PROJECT_ID: ${{ secrets.GKE_PROJECT }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Create cluster if missing
        run: |
          existing_cluster="$(gcloud container clusters list \
            --project "$PROJECT_ID" \
            --zone "$GKE_LOCATION" \
            --filter "name=$GKE_CLUSTER" \
            --format 'value(name)')"

          if [[ -z "$existing_cluster" ]]; then
            gcloud container clusters create "$GKE_CLUSTER" \
              --project "$PROJECT_ID" \
              --zone "$GKE_LOCATION" \
              --cluster-version "$GKE_CLUSTER_VERSION" \
              --workload-pool "$PROJECT_ID.svc.id.goog" \
              --workload-metadata GKE_METADATA \
              --gateway-api standard \
              --disk-size 32 \
              --num-nodes 1 \
              --enable-autoscaling \
              --min-nodes 1 \
              --max-nodes 4 \
              --machine-type e2-standard-2 \
              --quiet
          else
            echo "Cluster $GKE_CLUSTER already exists in $GKE_LOCATION"
          fi

      - name: Wait for cluster to be running
        run: |
          # Also handles a cluster whose creation began before this workflow run.
          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            status="$(gcloud container clusters describe "$GKE_CLUSTER" \
              --project "$PROJECT_ID" \
              --zone "$GKE_LOCATION" \
              --format 'value(status)')"
            echo "Cluster status: $status"
            case "$status" in
              RUNNING) exit 0 ;;
              PROVISIONING|RECONCILING) sleep 20 ;;
              *) echo "Cluster cannot be deployed to in status: $status"; exit 1 ;;
            esac
          done
          echo "Timed out waiting for cluster $GKE_CLUSTER to become RUNNING"
          exit 1

  build-publish-deploy:
    name: Build, publish and deploy applications
    needs: ensure-cluster
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    environment: GKE_PROJECT
    env:
      PROJECT_ID: ${{ secrets.GKE_PROJECT }}
      EXERCISES_NAMESPACE: ${{ github.ref_name == 'main' && 'exercises' || github.ref_name }}
      TODO_COMMIT: ${{ inputs.todo_commit }}
      TODO_ENVIRONMENT: ${{ inputs.todo_commit && inputs.todo_environment || github.ref_type == 'tag' && 'production' || github.ref == 'refs/heads/main' && 'staging' || '' }}
      BUILD_EXERCISES: ${{ github.ref_type == 'branch' && !inputs.todo_commit }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check out the Todo source commit
        if: env.TODO_COMMIT != ''
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.TODO_CODE_REPOSITORY || format('{0}/todo-app', github.repository_owner) }}
          ref: ${{ env.TODO_COMMIT }}
          token: ${{ secrets.TODO_CODE_READ_TOKEN || github.token }}
          persist-credentials: false
          path: todo-source

      - name: Form the image tags
        run: |
          branch="$(printf '%s' "$GITHUB_REF_NAME" | sed -E 's/[^a-zA-Z0-9_.-]+/-/g; s/^[.-]+//')"
          branch="${branch:-branch}"
          branch="${branch:0:87}"
          if [[ -n "$TODO_COMMIT" ]]; then
            source_sha="$(git -C todo-source rev-parse HEAD)"
            if [[ "$source_sha" != "$TODO_COMMIT" ]]; then
              echo "Expected a full Todo commit SHA, got $TODO_COMMIT" >&2
              exit 1
            fi
            registry_path="$REGISTRY/$PROJECT_ID/$REPOSITORY"
            tag="$TODO_ENVIRONMENT-$source_sha"
            echo "PROJECT_IMAGE_TAG=$registry_path/$PROJECT_IMAGE:$tag" >> "$GITHUB_ENV"
            echo "TODO_BACKEND_IMAGE_TAG=$registry_path/$TODO_BACKEND_IMAGE:$tag" >> "$GITHUB_ENV"
            echo "BROADCASTER_IMAGE_TAG=$registry_path/$BROADCASTER_IMAGE:$tag" >> "$GITHUB_ENV"
          fi
          printf 'LOG_OUTPUT_WRITER_IMAGE_TAG=%s/%s/%s/%s:%s-%s\n' \
            "$REGISTRY" "$PROJECT_ID" "$REPOSITORY" "$LOG_OUTPUT_WRITER_IMAGE" \
            "$branch" "$GITHUB_SHA" >> "$GITHUB_ENV"
          printf 'LOG_OUTPUT_READER_IMAGE_TAG=%s/%s/%s/%s:%s-%s\n' \
            "$REGISTRY" "$PROJECT_ID" "$REPOSITORY" "$LOG_OUTPUT_READER_IMAGE" \
            "$branch" "$GITHUB_SHA" >> "$GITHUB_ENV"
          printf 'PING_PONG_IMAGE_TAG=%s/%s/%s/%s:%s-%s\n' \
            "$REGISTRY" "$PROJECT_ID" "$REPOSITORY" "$PING_PONG_IMAGE" \
            "$branch" "$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud --quiet auth configure-docker "$REGISTRY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push The Project image
        if: env.TODO_COMMIT != ''
        uses: docker/build-push-action@v7
        with:
          context: ./todo-source/the_project
          push: true
          provenance: false
          tags: ${{ env.PROJECT_IMAGE_TAG }}

      - name: Build and push Todo Backend image
        if: env.TODO_COMMIT != ''
        uses: docker/build-push-action@v7
        with:
          context: ./todo-source/todo_backend
          push: true
          provenance: false
          tags: ${{ env.TODO_BACKEND_IMAGE_TAG }}

      - name: Build and push Broadcaster image
        if: env.TODO_COMMIT != ''
        uses: docker/build-push-action@v7
        with:
          context: ./todo-source/broadcaster
          push: true
          provenance: false
          tags: ${{ env.BROADCASTER_IMAGE_TAG }}

      - name: Build and push Log Output writer image
        if: env.BUILD_EXERCISES == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./log_output
          file: ./log_output/Dockerfile.writer
          push: true
          provenance: false
          tags: ${{ env.LOG_OUTPUT_WRITER_IMAGE_TAG }}

      - name: Build and push Log Output reader image
        if: env.BUILD_EXERCISES == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./log_output
          file: ./log_output/Dockerfile.reader
          push: true
          provenance: false
          tags: ${{ env.LOG_OUTPUT_READER_IMAGE_TAG }}

      - name: Build and push Ping Pong image
        if: env.BUILD_EXERCISES == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./ping_pong
          file: ./ping_pong/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.PING_PONG_IMAGE_TAG }}

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          project_id: ${{ env.PROJECT_ID }}
          location: ${{ env.GKE_LOCATION }}

      - name: Ensure Gateway API is ready
        run: |
          gateway_channel="$(gcloud container clusters describe "$GKE_CLUSTER" \
            --project "$PROJECT_ID" \
            --zone "$GKE_LOCATION" \
            --format 'value(networkConfig.gatewayApiConfig.channel)')"
          if [[ "$gateway_channel" != "CHANNEL_STANDARD" ]]; then
            gcloud container clusters update "$GKE_CLUSTER" \
              --project "$PROJECT_ID" \
              --zone "$GKE_LOCATION" \
              --gateway-api standard \
              --quiet
          fi

          deadline=$((SECONDS + 2700))
          until kubectl get gatewayclass gke-l7-global-external-managed >/dev/null 2>&1 && \
            kubectl wait --for=condition=Established --timeout=20s \
              crd/gateways.gateway.networking.k8s.io \
              crd/httproutes.gateway.networking.k8s.io \
              crd/healthcheckpolicies.networking.gke.io >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for the GKE Gateway API resources"
              exit 1
            fi
            echo "Waiting for GKE Gateway API resources and GatewayClass"
            sleep 20
          done

      - name: Install Argo CD
        run: |
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n argocd apply --server-side --force-conflicts \
            -f "https://raw.githubusercontent.com/argoproj/argo-cd/$ARGO_CD_VERSION/manifests/install.yaml"
          kubectl -n argocd patch service argocd-server --type=merge -p '{"spec":{"type":"LoadBalancer"}}'
          kubectl -n argocd rollout status deployment/argocd-server --timeout=10m
          kubectl -n argocd rollout status deployment/argocd-repo-server --timeout=10m
          kubectl -n argocd rollout status statefulset/argocd-application-controller --timeout=10m

      - name: Deploy NATS
        working-directory: ./nats
        run: |
          helm repo add nats https://nats-io.github.io/k8s/helm/charts/
          helm repo update
          helm upgrade --install my-nats nats/nats \
            --namespace nats --create-namespace \
            --values values.yaml \
            --wait

      - name: Deploy monitoring
        working-directory: ./monitoring
        timeout-minutes: 45
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

          helm upgrade --install prom prometheus-community/prometheus \
            --namespace monitoring --create-namespace \
            --values prom-values.yaml \
            --wait

          helm upgrade --install loki grafana/loki \
            --namespace monitoring \
            --values loki-values.yaml \
            --wait

          helm upgrade --install k8smon grafana/k8s-monitoring \
            --namespace monitoring \
            --values k8smon-values.yaml \
            --set-string "cluster.name=$GKE_CLUSTER" \
            --wait

          helm upgrade --install grafana grafana/grafana \
            --namespace monitoring \
            --values grafana-values.yaml \
            --wait

      - name: Install Argo Rollouts
        working-directory: ${{ runner.temp }}
        run: |
          release="https://github.com/argoproj/argo-rollouts/releases/download/$ARGO_ROLLOUTS_VERSION"
          kubectl create namespace argo-rollouts --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply --server-side --namespace argo-rollouts -f "$release/install.yaml"
          kubectl wait --for=condition=Established --timeout=2m \
            crd/rollouts.argoproj.io \
            crd/analysistemplates.argoproj.io \
            crd/analysisruns.argoproj.io
          kubectl -n argo-rollouts rollout status deployment/argo-rollouts --timeout=5m

      - name: Install SOPS
        working-directory: ${{ runner.temp }}
        run: |
          binary="sops-v${SOPS_VERSION}.linux.amd64"
          release="https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}"
          curl --fail --silent --show-error --location "$release/$binary" --output "$binary"
          curl --fail --silent --show-error --location \
            "$release/sops-v${SOPS_VERSION}.checksums.txt" --output sops-checksums.txt
          grep -E "[[:space:]]+${binary//./\\.}$" sops-checksums.txt | sha256sum --check --strict -
          install -m 0755 "$binary" "$RUNNER_TEMP/sops"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Prepare application namespaces and Secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
        run: |
          test -n "$SOPS_AGE_KEY" || {
            echo "AGE_SECRET_KEY is missing from the GKE_PROJECT environment"
            exit 1
          }
          apply_secret() {
            sops --decrypt --output-type json "$1/manifests/secret.enc.yaml" \
              | jq --arg namespace "$2" '.metadata.namespace = $namespace' \
              | kubectl apply --server-side -f -
          }
          if [[ -n "$TODO_ENVIRONMENT" ]]; then
            kubectl create namespace "$TODO_ENVIRONMENT" --dry-run=client -o yaml | kubectl apply -f -
            apply_secret todo_backend "$TODO_ENVIRONMENT"
            if [[ "$TODO_ENVIRONMENT" == "production" ]]; then
              apply_secret broadcaster production
            fi
          fi
          if [[ "$BUILD_EXERCISES" == "true" ]]; then
            kubectl create namespace "$EXERCISES_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
            apply_secret ping_pong "$EXERCISES_NAMESPACE"
          fi

      - name: Check out the branch for manifest updates
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_type == 'tag' && 'refs/heads/main' || github.ref }}
          path: manifest-updates

      - name: Configure the Todo Application
        if: env.TODO_ENVIRONMENT != ''
        working-directory: manifest-updates
        run: |
          app="the_project/manifests/argocd/$TODO_ENVIRONMENT.yaml"
          if [[ -n "$TODO_COMMIT" ]]; then
            yq -i '.spec.source.kustomize.images = [
              ("PROJECT/IMAGE=" + strenv(PROJECT_IMAGE_TAG)),
              ("TODO/IMAGE=" + strenv(TODO_BACKEND_IMAGE_TAG)),
              ("BROADCASTER/IMAGE=" + strenv(BROADCASTER_IMAGE_TAG))
            ]' "$app"
          fi

          if [[ "$TODO_ENVIRONMENT" == "production" ]]; then
            backup_config="$GITHUB_WORKSPACE/todo_backend/manifests/backup-configmap.yaml"
            BACKUP_PATCH="$(yq '.data.GCS_BUCKET = (strenv(PROJECT_ID) + "-todo-backups")' "$backup_config")"
            export BACKUP_PATCH
            yq -i '
              .spec.source.targetRevision = strenv(GITHUB_SHA) |
              .spec.source.kustomize.patches[0].patch = strenv(BACKUP_PATCH)
            ' "$app"
          fi
          git add -- "$app"

      - name: Update Log Output and Ping Pong manifests
        if: env.BUILD_EXERCISES == 'true'
        working-directory: manifest-updates
        run: |
          (
            cd log_output
            kustomize edit set namespace "$EXERCISES_NAMESPACE"
            kustomize edit set image "LOG/WRITER=$LOG_OUTPUT_WRITER_IMAGE_TAG" "LOG/READER=$LOG_OUTPUT_READER_IMAGE_TAG"
          )
          (
            cd ping_pong
            kustomize edit set image "PING/PONG=$PING_PONG_IMAGE_TAG"
          )
          kustomize build log_output > /dev/null
          git add -- log_output/kustomization.yaml ping_pong/kustomization.yaml

      - name: Commit manifests for Argo CD
        working-directory: manifest-updates
        run: |
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          source_commit="${TODO_COMMIT:-$GITHUB_SHA}"
          git commit -m "Update application manifests for ${source_commit:0:12}"
          git push origin HEAD

      - name: Apply the Todo Application
        if: env.TODO_ENVIRONMENT != ''
        working-directory: manifest-updates
        run: kubectl apply -f "the_project/manifests/argocd/$TODO_ENVIRONMENT.yaml"

      - name: Apply the Log Output and Ping Pong Application
        if: github.ref == 'refs/heads/main' && env.BUILD_EXERCISES == 'true'
        working-directory: manifest-updates
        run: kubectl apply -f log_output/manifests/argocd/application.yaml

      - name: Deployment summary
        run: |
          wait_for_ip() {
            local namespace="$1" resource="$2" filter="$3" ip
            while true; do
              ip="$(kubectl -n "$namespace" get "$resource" --ignore-not-found -o json | jq -r "$filter")" || return 1
              if [[ -n "$ip" ]]; then
                printf '%s\n' "$ip"
                return 0
              fi
              echo "Waiting for $resource in $namespace to receive an IP" >&2
              sleep 15
            done
          }

          argocd_ip="$(wait_for_ip argocd service/argocd-server 'first(.status.loadBalancer.ingress[]? | .ip // empty)')"
          applications="$(kubectl -n argocd get applications.argoproj.io --no-headers \
            -o custom-columns=NAME:.metadata.name,NAMESPACE:.spec.destination.namespace)"
          gateway_ip_filter='first(.status.addresses[]? | select((.type // "IPAddress") == "IPAddress") | .value) // empty'

          {
            printf '## Deployment endpoints\n\n'
            printf 'Cluster: `%s` | Git %s: `%s`\n\n' "$GKE_CLUSTER" "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME"
            printf '### Argo CD\n\n'
            printf 'UI: [https://%s](https://%s)\n\n' "$argocd_ip" "$argocd_ip"
            printf '%s\n' 'Sign in as `admin`. Retrieve the initial password in your local terminal.' '' \
              '```sh' "kubectl -n argocd get secret argocd-initial-admin-secret -o go-template='{{.data.password | base64decode}}'" '```' ''
            while read -r app namespace; do
              case "$app" in
                todo-staging|todo-production)
                  ip="$(wait_for_ip "$namespace" gateways.gateway.networking.k8s.io/project-todo-gateway "$gateway_ip_filter")"
                  printf '### Todo App (%s)\n\n' "$namespace"
                  printf -- '- Gateway IP: `%s`\n' "$ip"
                  printf -- '- Todo App: [http://%s/](http://%s/)\n\n' "$ip" "$ip"
                  ;;
                ping-pong)
                  ip="$(wait_for_ip "$namespace" gateways.gateway.networking.k8s.io/log-output-ping-pong-gateway "$gateway_ip_filter")"
                  printf '### Log Output and Ping Pong\n\nNamespace: `%s`\n\n' "$namespace"
                  printf -- '- Gateway IP: `%s`\n' "$ip"
                  printf -- '- Log Output: [http://%s/](http://%s/)\n' "$ip" "$ip"
                  printf -- '- Ping Pong: [http://%s/pingpong](http://%s/pingpong)\n\n' "$ip" "$ip"
                  ;;
              esac
            done <<< "$applications"
            printf '\n### Grafana\n\nNamespace: `monitoring`\n\n'
            printf 'Run:\n\n```sh\nkubectl port-forward --namespace monitoring svc/grafana 3000:80\n```\n\n'
            printf 'Then open [http://localhost:3000](http://localhost:3000).\n'
            printf 'NATS dashboard: [NATS Overview](http://localhost:3000/d/nats-overview).\n'
            printf '\n### Prometheus\n\nNamespace: `monitoring`\n\n'
            printf 'Run:\n\n```sh\nkubectl port-forward svc/prom-prometheus-server -n monitoring 9090:80\n```\n\n'
            printf 'Then open [http://localhost:9090](http://localhost:9090).\n'
          } >> "$GITHUB_STEP_SUMMARY"
