name: Delete GKE cluster, images and backups

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-application
  cancel-in-progress: false
  queue: max

env:
  GKE_CLUSTER: dwk-cluster
  GKE_LOCATION: europe-west1-b
  REGISTRY: europe-west1-docker.pkg.dev
  ARTIFACT_LOCATION: europe-west1
  REPOSITORY: dwk-repository
  PROJECT_IMAGE: the-project
  TODO_BACKEND_IMAGE: todo-backend

jobs:
  delete-gcp-resources:
    name: Delete cluster and application images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: GKE_PROJECT
    env:
      PROJECT_ID: ${{ secrets.GKE_PROJECT }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Delete GKE cluster
        run: |
          existing_cluster="$(gcloud container clusters list \
            --project "$PROJECT_ID" \
            --zone "$GKE_LOCATION" \
            --filter "name=$GKE_CLUSTER" \
            --format 'value(name)')"

          if [[ -n "$existing_cluster" ]]; then
            gcloud container clusters delete "$GKE_CLUSTER" \
              --project "$PROJECT_ID" \
              --zone "$GKE_LOCATION" \
              --quiet
          else
            echo "Cluster $GKE_CLUSTER is already absent"
          fi

      - name: Delete application images
        run: |
          existing_images="$(gcloud artifacts packages list \
            --project "$PROJECT_ID" \
            --location "$ARTIFACT_LOCATION" \
            --repository "$REPOSITORY" \
            --format 'value(name.basename())')"

          for image in "$PROJECT_IMAGE" "$TODO_BACKEND_IMAGE"; do
            if ! grep -Fxq "$image" <<< "$existing_images"; then
              echo "Image $image is already absent"
              continue
            fi

            gcloud artifacts docker images delete \
              "$REGISTRY/$PROJECT_ID/$REPOSITORY/$image" \
              --project "$PROJECT_ID" \
              --delete-tags \
              --quiet
          done

  delete-backups:
    name: Empty backup bucket
    needs: delete-gcp-resources
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: GKE_PROJECT
    env:
      PROJECT_ID: ${{ secrets.GKE_PROJECT }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Delete backup objects
        run: |
          bucket_name="${PROJECT_ID}-todo-backups"
          bucket_url="gs://${bucket_name}"
          existing_bucket="$(gcloud storage buckets list \
            --project "$PROJECT_ID" \
            --filter "name=$bucket_name" \
            --format 'value(name)')"

          if [[ -z "$existing_bucket" ]]; then
            echo "Backup bucket $bucket_name is already absent"
            exit 0
          fi

          existing_objects="$(gcloud storage ls "$bucket_url/" \
            --project "$PROJECT_ID" \
            --all-versions)"

          if [[ -z "$existing_objects" ]]; then
            echo "Backup bucket $bucket_name is already empty"
            exit 0
          fi

          # Target objects only: keep the bucket and its IAM grants.
          gcloud storage rm "$bucket_url/**" \
            --project "$PROJECT_ID" \
            --all-versions \
            --quiet

          echo "Deleted backups"
          echo "Soft-deleted objects remain billable until their retention period expires"
