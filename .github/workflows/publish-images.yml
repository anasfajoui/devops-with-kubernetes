name: Build and publish Docker images

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-images.yml"
      - "log_output/**"
      - "ping_pong/**"
      - "the_project/**"
      - "todo_backend/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true 

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Log Output writer
            context: ./log_output
            dockerfile: ./log_output/Dockerfile.writer
            manifest: ./log_output/manifests/deployment.yaml
            container: output-writer
          - name: Log Output reader
            context: ./log_output
            dockerfile: ./log_output/Dockerfile.reader
            manifest: ./log_output/manifests/deployment.yaml
            container: output-reader
          - name: Ping Pong
            context: ./ping_pong
            dockerfile: ./ping_pong/Dockerfile
            manifest: ./ping_pong/manifests/deployment.yaml
            container: ping-pong
          - name: Todo App
            context: ./the_project
            dockerfile: ./the_project/Dockerfile
            kustomization: ./the_project/kustomization.yaml
            image_name: PROJECT/IMAGE
          - name: Todo Backend
            context: ./todo_backend
            dockerfile: ./todo_backend/Dockerfile
            kustomization: ./todo_backend/kustomization.yaml
            image_name: TODO/IMAGE

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Read image tag from configuration
        id: image
        shell: bash
        env:
          CONTAINER_NAME: ${{ matrix.container }}
          DEPLOYMENT_MANIFEST: ${{ matrix.manifest }}
          KUSTOMIZATION_FILE: ${{ matrix.kustomization }}
          IMAGE_NAME: ${{ matrix.image_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import yaml

          kustomization = os.environ["KUSTOMIZATION_FILE"]
          if kustomization:
              config = yaml.safe_load(Path(kustomization).read_text(encoding="utf-8"))
              image_name = os.environ["IMAGE_NAME"]
              matches = [
                  entry for entry in config.get("images", [])
                  if entry.get("name") == image_name
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"Expected exactly one image named {image_name} in {kustomization}"
                  )
              entry = matches[0]
              if entry.get("digest"):
                  raise SystemExit("Publishing an image requires a tag, not a digest")
              image = entry.get("newName", image_name)
              if "newTag" in entry:
                  repository, separator, name = image.rpartition("/")
                  image = f"{repository}{separator}{name.split(':', 1)[0]}:{entry['newTag']}"
          else:
              manifest = os.environ["DEPLOYMENT_MANIFEST"]
              config = yaml.safe_load(Path(manifest).read_text(encoding="utf-8"))
              container_name = os.environ["CONTAINER_NAME"]
              matches = [
                  container for container in config["spec"]["template"]["spec"]["containers"]
                  if container["name"] == container_name
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"Expected exactly one container named {container_name} in {manifest}"
                  )
              image = matches[0]["image"]

          if "/" not in image or ":" not in image.rsplit("/", 1)[-1] or "@" in image:
              raise SystemExit(f"The image must include a registry namespace and tag: {image}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"image={image}\n")
          PY

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.image }}
