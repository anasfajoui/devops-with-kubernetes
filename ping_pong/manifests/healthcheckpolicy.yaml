apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  namespace: exercises
  name: ping-pong-health-check
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_SERVING_PORT
        requestPath: /pings
  targetRef:
    group: ""
    kind: Service
    name: ping-pong-svc
