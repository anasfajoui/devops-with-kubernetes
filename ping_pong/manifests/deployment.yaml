apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: exercises
  name: ping-pong-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
        - name: ping-pong
          image: fajouianas/devops-with-kubernetes:2.07-pingpong
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: ping-pong-config
            - secretRef:
                name: ping-pong-db-secret
          ports:
            - name: http
              containerPort: 3000
