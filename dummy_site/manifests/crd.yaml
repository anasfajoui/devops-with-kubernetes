apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dummysites.dwk.dev
spec:
  group: dwk.dev
  scope: Namespaced
  names:
    plural: dummysites
    singular: dummysite
    kind: DummySite
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - website_url
              properties:
                website_url:
                  type: string
                  pattern: '^https?://[^/\s?#]+\S*$'
