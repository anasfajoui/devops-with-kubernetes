apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  namespace: exercises
  name: log-output-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: outputlogger
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 50
        - analysis:
            templates:
              - templateName: namespace-cpu
            args:
              - name: namespace
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
        - setWeight: 100
  template:
    metadata:
      labels:
        app: outputlogger
    spec:
      containers:
        - name: output-writer
          image: LOG/WRITER
          imagePullPolicy: Always
          env:
            - name: LOG_FILE_PATH
              value: /shared/output.log
          volumeMounts:
            - name: shared-logs
              mountPath: /shared
        - name: output-reader
          image: LOG/READER
          imagePullPolicy: Always
          env:
            - name: LOG_FILE_PATH
              value: /shared/output.log
            - name: INFORMATION_FILE_PATH
              value: /config/information.txt
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: log-output-config
                  key: MESSAGE
            - name: PING_PONG_URL
              valueFrom:
                configMapKeyRef:
                  name: log-output-config
                  key: PING_PONG_URL
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 6
          volumeMounts:
            - name: shared-logs
              mountPath: /shared
            - name: log-output-config
              mountPath: /config
      volumes:
        - name: shared-logs
          emptyDir: {}
        - name: log-output-config
          configMap:
            name: log-output-config
            items:
              - key: information.txt
                path: information.txt
