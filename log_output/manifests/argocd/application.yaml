apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ping-pong
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/anasfajoui/devops-with-kubernetes.git
    targetRevision: main
    path: log_output
  destination:
    server: https://kubernetes.default.svc
    namespace: exercises
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
