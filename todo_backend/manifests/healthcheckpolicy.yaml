apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  namespace: project
  name: todo-backend-health-check
spec:
  default:
    checkIntervalSec: 10
    timeoutSec: 6
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_SERVING_PORT
        requestPath: /todos/readyz
  targetRef:
    group: ""
    kind: Service
    name: todo-backend-svc
