apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: project
  name: todo-backend-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      containers:
        - name: todo-backend
          image: fajouianas/devops-with-kubernetes:2.06-todo-backend
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: todo-backend-config
          ports:
            - containerPort: 3000
